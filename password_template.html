<style>
:root{--paper:#E6E3DF; --ink:#1A1A18; --muted:#5F5C58; --rule:rgba(26,26,24,.22); --field:#F2F0ED; --hl:#E4FF1A; --err:#A3242B;

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--paper:#151614; --ink:#ECEAE5; --muted:#A29F99; --rule:rgba(236,234,229,.24); --field:#1E1F1D; --err:#F08A8F} }
:root[data-theme="dark"]{--paper:#151614; --ink:#ECEAE5; --muted:#A29F99; --rule:rgba(236,234,229,.24); --field:#1E1F1D; --err:#F08A8F}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hidden{display:none!important}
.staticrypt-spinner-container{height:100%; display:grid; place-items:center}
.staticrypt-spinner{width:28px; height:28px; border:2px solid var(--rule); border-top-color:var(--ink); border-radius:50%; animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.staticrypt-content{min-height:100%; display:grid; place-items:center; padding:clamp(1.5rem,6vw,4rem)}
.card{width:100%; max-width:26rem}
.mark{display:block; width:40px; height:40px; margin-bottom:2.2rem}
.name{font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,9vw,3.6rem); line-height:1; letter-spacing:-.03em; margin:0}
.role{font-family:var(--serif); font-size:1.25rem; color:var(--muted); margin:.5rem 0 0}
.rule{height:1px; background:var(--ink); border:0; margin:2rem 0 1.4rem}
.instructions{font-size:.9375rem; line-height:1.55; color:var(--muted); margin:0 0 1.2rem}
label.field-label{display:block; font-size:.8125rem; color:var(--muted); margin:0 0 .4rem}
.staticrypt-password-container{position:relative}
#staticrypt-password{width:100%; font:inherit; font-size:1rem; color:var(--ink); background:var(--field); border:1px solid var(--rule); border-radius:.6rem; padding:.85rem 4.5rem .85rem .95rem; outline:none; transition:border-color .15s ease, box-shadow .15s ease}
#staticrypt-password:focus{border-color:var(--ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent)}
#staticrypt-password[aria-invalid="true"]{border-color:var(--err)}
.toggle{position:absolute; right:.5rem; top:50%; transform:translateY(-50%); font:inherit; font-size:.8125rem; color:var(--muted); background:transparent; border:0; padding:.35rem .5rem; border-radius:.4rem; cursor:pointer}
.toggle:hover{color:var(--ink)} .toggle:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
.error{min-height:1.4rem; font-size:.8125rem; color:var(--err); margin:.45rem 0 .3rem}
.staticrypt-remember{display:flex; align-items:center; gap:.55rem; font-size:.875rem; color:var(--ink); margin:0 0 1.3rem; cursor:pointer; user-select:none}
.staticrypt-remember input{width:1rem; height:1rem; accent-color:var(--ink); margin:0}
.staticrypt-decrypt-button{width:100%; font:inherit; font-size:.9375rem; font-weight:500; color:var(--paper); background:var(--ink); border:0; border-radius:999px; padding:.85rem 1.2rem; cursor:pointer; transition:opacity .15s ease}
.staticrypt-decrypt-button:hover{opacity:.88} .staticrypt-decrypt-button:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.staticrypt-decrypt-button[disabled]{opacity:.6; cursor:progress}
.foot{margin-top:2.4rem; font-size:.8125rem; color:var(--muted)}
.foot a{color:inherit}
@media (prefers-reduced-motion: reduce){ .staticrypt-spinner{animation-duration:2.4s} }

<script>
  // filled in by StatiCrypt when the page is encrypted (format '/*[|variable_name|]*/0')
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    templateToggleAltShow = "/*[|template_toggle_show|]*/0",
    templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;

  const templateConfig = {
    rememberExpirationKey: "staticrypt_expiration",
    rememberPassphraseKey: "staticrypt_passphrase",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  };
  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  window.onload = async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (!isSuccessful) {
      document.getElementById("staticrypt_loading").classList.add("hidden");
      document.getElementById("staticrypt_content").classList.remove("hidden");
      document.getElementById("staticrypt-password").focus();
      if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
    }
  };

  // show / hide the password as text
  const toggle = document.getElementById("staticrypt-toggle"), field = document.getElementById("staticrypt-password"), err = document.getElementById("staticrypt-error");
  toggle.addEventListener("click", function () {
    const show = field.type === "password";
    field.type = show ? "text" : "password";
    toggle.textContent = show ? templateToggleAltHide : templateToggleAltShow;
    field.focus();
  });
  field.addEventListener("input", function () { err.textContent = ""; field.removeAttribute("aria-invalid"); });

  // decrypt; on failure show a calm inline message instead of an alert
  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const btn = this.querySelector(".staticrypt-decrypt-button");
    btn.disabled = true;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(field.value, document.getElementById("staticrypt-remember").checked);
    if (!isSuccessful) {
      btn.disabled = false;
      err.textContent = templateError;
      field.setAttribute("aria-invalid", "true");
      field.select();
    }
  });
</script>
</body>
</html>
